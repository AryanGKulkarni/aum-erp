name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./aum-erp-backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/aum-erp-backend:latest

      # Frontend
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./aum-erp-frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/aum-erp-frontend:latest

  deploy:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/erp

            docker compose pull

            docker compose up -d